[package]
name = "concord-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Concord's desktop executable, driven by a host over a local socket"
repository.workspace = true

[[bin]]
name = "concord"
path = "src/main.rs"
doc = false

[features]
debug = ["concord-api/debug"]

[dependencies]
concord-api = { workspace = true }
concord-controller = { workspace = true }
concord-engine = { workspace = true }
concord-ipc = { workspace = true }
concord-platform = { workspace = true }
concord-proto = { workspace = true }
concord-rpc = { workspace = true }
futures-util = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true, features = ["release_max_level_debug"] }
# Never called here: it caps the `log` records that dependencies such as rustls compile in.
log = { workspace = true, features = ["release_max_level_debug"] }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[lints]
workspace = true
