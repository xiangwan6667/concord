name: fuzz-smoke

# `ci` only compiles the fuzz targets. This builds them as `.agents/commands.md` describes, on the pinned stable
# toolchain with coverage instrumentation and no sanitizer, and runs each one for a short while from an empty corpus.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        required: false
        type: number
        default: 120

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz smoke
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SECONDS_PER_TARGET: ${{ inputs.seconds || 120 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz

      # The explicit `--target` keeps the instrumentation off build scripts.
      - name: Build the fuzz targets
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          echo "FUZZ_BIN=fuzz/target/$host/release" >> "$GITHUB_ENV"
          RUSTFLAGS="-Cpasses=sancov-module -Cllvm-args=-sanitizer-coverage-level=4 \
            -Cllvm-args=-sanitizer-coverage-inline-8bit-counters -Cllvm-args=-sanitizer-coverage-pc-table \
            -Cllvm-args=-sanitizer-coverage-trace-compares -Cdebug-assertions -Coverflow-checks -Ccodegen-units=1" \
            cargo build --locked --manifest-path fuzz/Cargo.toml --release --target "$host" --bins

      - name: Run each target
        run: |
          mkdir -p fuzz/artifacts
          failed=0
          for source in fuzz/fuzz_targets/*.rs; do
            name=$(basename "$source" .rs)
            mkdir -p "fuzz/corpus/$name"
            echo "::group::$name"
            if ! "$FUZZ_BIN/$name" -max_total_time="$SECONDS_PER_TARGET" -rss_limit_mb=2048 \
              -artifact_prefix="fuzz/artifacts/$name-" "fuzz/corpus/$name"; then
              echo "::error::$name failed"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          retention-days: 30
