[package]
name = "concord-tun"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "TUN devices, routes and the stack driver for Concord"
repository.workspace = true

[lib]
doctest = false

[features]
testing = []

[dependencies]
concord-common = { workspace = true, features = ["io"] }
tokio = { workspace = true, features = ["net", "time", "io-util", "macros", "rt", "sync", "process"] }
tokio-util = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
tun-rs = { workspace = true }
concord-netstack = { workspace = true }
concord-platform = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
route_manager = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Rpc",
    "Win32_UI_Shell",
] }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
mio = { workspace = true }
rtnetlink = { workspace = true }

[dev-dependencies]
concord-tun = { path = ".", features = ["testing"] }
tokio = { workspace = true, features = ["full", "test-util"] }
smoltcp = { workspace = true, features = [
    "std",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-tcp",
    "socket-tcp-cubic",
    "socket-tcp-reno",
    "async",
] }

[lints]
workspace = true
