[package]
name = "concord-dns"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "DNS resolver, upstreams, fake-ip and listener for Concord"
repository.workspace = true

[lib]
doctest = false

[dependencies]
concord-common = { workspace = true, features = ["io"] }
concord-config = { workspace = true }
concord-tls = { workspace = true }
concord-transport = { workspace = true }
concord-platform = { workspace = true }
tokio = { workspace = true, features = ["net", "time", "io-util", "macros", "rt", "sync"] }
tokio-rustls = { workspace = true }
quinn = { workspace = true }
h3 = { workspace = true }
h3-quinn = { workspace = true }
rustls-pki-types = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
hickory-proto = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
concord-net = { workspace = true }
tokio = { workspace = true, features = ["full"] }
rustls = { workspace = true }
rcgen = { workspace = true }

[lints]
workspace = true
