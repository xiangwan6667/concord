async-trait = { workspace = true }
futures-util = { workspace = true }
bytes = { workspace = true }
arc-swap = { workspace = true }
shadowsocks = { workspace = true, features = ["aead-cipher", "aead-cipher-extra", "aead-cipher-2022", "aead-cipher-2022-extra", "stream-cipher"] }
quinn = { workspace = true }
quinn-proto = { workspace = true }
h3 ={ workspace = true }
h3-quinn = { workspace = true }
rustls = { workspace = true }
http = { workspace = true }
h2 = { workspace = true }
rcgen = { workspace = true }
x509-parser = { workspace = true }
time = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
sha3 = { workspace = true }
md-5 = { workspace = true }
hmac = { workspace = true }
blake2 = { workspace = true }
blake3 = { workspace = true }
ctr = { workspace = true }
aes = { workspace = true }
aes-cfb = { workspace = true }
aes-gcm = { workspace = true }
x25519-dalek = { workspace = true }
chacha20poly1305 = { workspace = true }
chacha20 = { workspace = true }
cfb-mode = { workspace = true }
crc32fast = { workspace = true }
aws-lc-rs = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
num-bigint = { workspace = true }
rand = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
indexmap = { workspace = true }
gotatun = { workspace = true }
ipnetwork = { workspace = true }
argon2 = { workspace = true }
russh = { workspace = true }
hickory-proto = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
h2 = { workspace = true }
concord-test-support = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
