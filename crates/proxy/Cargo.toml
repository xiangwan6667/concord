[package]
name = "concord-proxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Outbound proxy protocols for Concord"
repository.workspace = true

[lib]
doctest = false

[dependencies]
concord-common = { workspace = true, features = ["io"] }
concord-config = { workspace = true }
concord-net = { workspace = true }
