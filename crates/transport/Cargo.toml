[package]
name = "concord-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Stream transports and multiplexing for Concord"
repository.workspace = true

[lib]
doctest = false

[dependencies]
concord-common = { workspace = true, features = ["io"] }
concord-tls = { workspace = true }
tokio = { workspace = true, features = ["net", "time", "io-util", "macros", "rt", "sync"] }
tokio-util = { workspace = true }
futures-util = { workspace = true }
http = { workspace = true }
h2 = { workspace = true }
h3 = { workspace = true }
h3-quinn = { workspace = true }
quinn = { workspace = true }
bytes = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
aws-lc-rs = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
hmac = { workspace = true }
sha1 = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pki-types = { workspace = true }

[lints]
workspace = true
