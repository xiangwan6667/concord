[package]
name = "api-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Release measurements of Concord's control API"
repository.workspace = true

[[bin]]
name = "api-bench"
path = "src/main.rs"

[target.'cfg(unix)'.dependencies]
concord-common = { workspace = true, features = ["io"] }
concord-api = { workspace = true }
concord-engine = { workspace = true }
concord-ipc = { workspace = true }
concord-platform = { workspace = true }
concord-rpc = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
