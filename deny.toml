[graph]
all-features = false

[advisories]
ignore = [
  # basic-toml and proc-macro-error2 only run at compile time, inside age's i18n macros (i18n-config and
  # i18n-embed-fl); neither is linked into a binary, and neither has a fixed release to move to.
  { id = "RUSTSEC-2026-0374", reason = "basic-toml: unmaintained, compile-time only through age's i18n macros" },
  { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2: unmaintained, compile-time only through age's i18n-embed-fl macros" },
  # russh-util 0.52, the latest, depends on chrono only for wasm32, a target Concord does not build; cargo-deny
  # still reports it because it checks every target.
  { id = "RUSTSEC-2026-0543", reason = "chrono: unmaintained, a wasm32-only dependency of russh-util and not built for any Concord target" },
]

[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "GPL-3.0-or-later",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "allow"
deny = [
  # aws-lc-fips-sys declares the OpenSSL license and FIPS mode has no use here.
  { name = "aws-lc-fips-sys" },
  { name = "serde_yml" },
  { name = "serde_yaml" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
